<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Wedding Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Kevin & Joana | Wedding Fellowship</title>
</head>

<body>

    <main class="card">

        <!-- Header -->
        <h3>WELCOME</h3>

        <!-- Names -->
        <h1>Kevin &amp; Joana</h1>

        <div class="gold-line"></div>

        <!-- Event -->
        <p class="subtitle">
            Wedding Fellowship
        </p>

        <p class="date">
            January 22, 2027 @ 4:30PM
        </p>

        <!-- Guest Search -->
        <section class="guest-search">

            <label for="searchInput">
                FIND YOUR TABLE
            </label>

            <input
                type="text"
                id="searchInput"
                placeholder="Enter your full name"
                autocomplete="off"
            >

            <button
                type="button"
                onclick="findGuest()"
            >
                Find My Table
            </button>

        </section>

        <!-- Search Result -->
        <div id="result"></div>

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
