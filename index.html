<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Wedding Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Kevin & Joana</title>
</head>

<body>

<div class="card">

    <div class="floral floral-top">❀</div>
    <div class="floral floral-bottom">❀</div>

    <div class="heart">♡</div>

    <h3>WELCOME</h3>

    <h1>Kevin &amp; Joana</h1>

    <div class="gold-line"></div>

    <p class="subtitle">
        Wedding Fellowship
    </p>

    <p class="date">
        January 22, 2027 @ 4:30PM
    </p>

    <p class="location">
        DON JOSE HEIGHTS CLUBHOUSE
    </p>

    <input
        type="text"
        id="searchInput"
        placeholder="Enter your full name"
    >

    <button onclick="findGuest()">
        Find My Table
    </button>

    <div id="result"></div>

</div>

<script>
function findGuest() {
    const name = document.getElementById("searchInput").value.trim();
    const result = document.getElementById("result");

    if (!name) {
        result.innerHTML = "Please enter your full name.";
        return;
    }

    result.innerHTML = "Searching for <strong>" + name + "</strong>...";
}
</script>

</body>
</html>
